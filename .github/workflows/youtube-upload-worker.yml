name: YouTube Upload Worker

# Uploads already-rendered videos (blog + listing, both already on
# Cloudinary) to Xpress Vet's own YouTube channel as Shorts. No ffmpeg
# needed here — this worker only downloads+re-uploads, it never renders —
# so this workflow is lighter than the other two video workers.
#
# Runs once a day, not every 30 minutes like the render workers — see
# jobs/youtubeUploadWorker.js's docstring for why (mostly content-strategy
# pacing, not a quota constraint). Each video it claims uploads as
# private + a specific scheduled publishAt time spread across that day
# (Nigeria-engagement-weighted, see the worker's docstring) — so this
# cron MUST run before the earliest of those slots (8am UTC / 9am WAT),
# otherwise YouTube rejects a publishAt that's already in the past.
#
# No-ops entirely (does nothing, exits clean) until Sam completes the
# one-time setup in scripts/youtube-authorize.mjs and these 3 secrets
# exist (Settings -> Secrets and variables -> Actions):
#   YOUTUBE_CLIENT_ID
#   YOUTUBE_CLIENT_SECRET
#   YOUTUBE_REFRESH_TOKEN
# Also needs the existing MONGODB_URI secret (already set up for the other
# two video workflows).

on:
  schedule:
    - cron: '0 5 * * *' # once daily, 5am UTC / 6am WAT — before the earliest scheduled slot
  workflow_dispatch: {} # lets you trigger a sweep manually from the Actions tab too

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile_backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile_backend/package-lock.json

      - run: npm ci

      - name: Run one YouTube-upload sweep
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/run-youtube-upload-sweep-once.mjs
