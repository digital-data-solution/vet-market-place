name: Scheduled Reels Worker

# Posts ready-made Reels stored in the ScheduledReel collection (first batch:
# the 11 narrated vet-tip videos, Oct 2026) at Sam's calendar slot —
# Monday/Wednesday/Friday 7:30pm WAT (18:30 UTC), after the 1pm and 6pm
# automatic blog Reels. One Reel per run; postAt decides which one is due.
# Needs the same secrets as instagram-upload-worker.yml.

on:
  schedule:
    - cron: '30 18 * * 1,3,5'
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile_backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile_backend/package-lock.json

      - run: npm ci

      - name: Run one scheduled-Reels sweep
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_TOKEN_ISSUED_AT: ${{ secrets.INSTAGRAM_TOKEN_ISSUED_AT }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: node scripts/run-scheduled-reels-sweep-once.mjs
