name: Listing Video Worker

# Free alternative to a paid Render Background Worker (see
# mobile_backend/src/jobs/listingVideoWorker.js's docstring for why this
# needs to run somewhere other than the main API service). This repo is
# public, so GitHub Actions minutes are unlimited/free here — no cost
# concern running this on a schedule.
#
# ffmpeg is installed explicitly below via apt — ubuntu-latest runners do
# NOT actually have it preinstalled (confirmed the hard way: a first
# version of this workflow assumed it was there, and the "confirm ffmpeg"
# check used `ffmpeg -version | head -1`, whose exit code is head's, not
# ffmpeg's — silently green even though ffmpeg was completely missing and
# every real render failed with `spawn ffmpeg ENOENT`).
#
# Secrets required (Settings → Secrets and variables → Actions → New
# repository secret) — never commit these:
#   MONGODB_URI
#   CLOUDINARY_CLOUD_NAME
#   CLOUDINARY_API_KEY
#   CLOUDINARY_API_SECRET

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes
  workflow_dispatch: {} # lets you trigger a sweep manually from the Actions tab too

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile_backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile_backend/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Confirm ffmpeg is available
        run: ffmpeg -version

      - run: npm ci

      - name: Run one listing-video sweep
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          # Without these, postListingVideoToTelegram/TikTok-drafts/Instagram-drafts
          # all silently no-op (see telegram.service.js's "not set up yet"
          # early-returns) — confirmed missing 2026-09-06: the render/upload
          # half of this pipeline worked the whole time, but nothing ever
          # reached the Telegram drafts channel from THIS workflow (the
          # listing-creation-time photo/WhatsApp-draft posts still worked
          # fine, since those run on Render, which does have these set).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_WA_DRAFTS_CHAT_ID: ${{ secrets.TELEGRAM_WA_DRAFTS_CHAT_ID }}
        run: node scripts/run-listing-video-sweep-once.mjs
