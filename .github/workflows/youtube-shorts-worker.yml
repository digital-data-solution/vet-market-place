name: YouTube Shorts Worker

# Uploads the YouTubeShort rows written by scripts/scheduleYouTubeShorts.mjs
# (trending-topic + vet-tip Shorts, Oct 2026). Each uploads as private with
# publishAt, so YouTube publishes it at its own slot — this run only has to
# happen some time before. Same secrets as youtube-upload-worker.yml.

on:
  schedule:
    - cron: '0 9 * * *' # daily 10am WAT, well before the 6pm WAT slots
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile_backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile_backend/package-lock.json

      - run: npm ci

      - name: Run one YouTube-Shorts sweep
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/run-youtube-shorts-sweep-once.mjs
