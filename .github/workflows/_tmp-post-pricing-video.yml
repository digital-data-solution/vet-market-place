name: TEMP - Post Pricing Video

on:
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile_backend/package-lock.json
      - run: npm ci
      - name: Post pricing video to Instagram + Facebook
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          node -e "
          import('./src/lib/instagramUpload.js').then(async ({ postReelToInstagram, isInstagramConfigured }) => {
            // Facebook already succeeded on the first run (see the earlier
            // workflow run) — only retrying Instagram here now that the
            // video has a real audio track, to avoid a duplicate FB post.
            const videoUrl = 'https://res.cloudinary.com/dhip3gaej/video/upload/v1789120180/marketing-videos/pricing-tiers-animation.mp4';
            const caption = 'Xpress Vet pricing, in 10 seconds. 🐾\n\nStart free — upgrade only when your practice actually outgrows it. No forced tiers, no surprise fees.\n\n📲 xpressvetmarketplace.com\n\n#XpressVet #VeterinaryPractice #PetsOfNigeria #AnimalHealth';
            try {
              if (!isInstagramConfigured()) throw new Error('not configured');
              const { url } = await postReelToInstagram(videoUrl, caption);
              console.log('Instagram: OK', url);
            } catch (err) { console.log('Instagram: FAILED', err.message); }
          });
          "
